name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Skip t3-env validation so the Next.js build succeeds without real env vars.
          # Real values must be set in the Vercel dashboard (frontend) and
          # Render dashboard (backend) before deploying to production.
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_API_URL: http://localhost:3001
