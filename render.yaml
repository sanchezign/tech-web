# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy this file via the Render dashboard: New → Blueprint → connect your repo.
# Secret env vars (MONGODB_URI, CORS_ORIGIN) must be set manually in the
# Render dashboard under Environment → Secret Files / Environment Variables
# after the first deploy. They are intentionally left without values here.

services:
  - type: web
    name: tech-web-api
    runtime: node
    region: oregon
    branch: main
    rootDir: apps/api
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3001

      # Set this in the Render dashboard → Environment → Secret Variables.
      # Format: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/<dbname>?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false

      # Set this in the Render dashboard to your deployed Vercel frontend URL.
      # Example: https://tech-web.vercel.app
      - key: CORS_ORIGIN
        sync: false

      - key: LOG_LEVEL
        value: info
